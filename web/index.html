<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="بازارک؛ بازار آنلاین خرید و فروش در افغانستان">
  <meta name="theme-color" content="#131921">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>بازارک | خرید و فروش آنلاین افغانستان</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e7e9ec; }
    body { font-family: Arial, Tahoma, sans-serif; }
    #loading { min-height: 100vh; background: #e7e9ec; color: #131921; }
    .top { background: #131921; padding: 10px 14px; }
    .top-inner { max-width: 1500px; margin: auto; display: flex; gap: 10px; align-items: center; }
    .brand { color: #fff; font-weight: 900; font-size: 22px; white-space: nowrap; }
    .brand small { display: block; color: #c7cbd0; font-size: 9px; margin-top: 3px; font-weight: 500; }
    .search { height: 44px; flex: 1; background: #fff; border-radius: 4px; overflow: hidden; display: flex; direction: ltr; }
    .search span { flex: 1; color: #777; padding: 12px 14px; text-align: right; direction: rtl; }
    .search b { width: 54px; background: #ff9900; display: grid; place-items: center; color: #111820; font-size: 24px; }
    .nav { height: 44px; background: #232f3e; color: #fff; display: flex; align-items: center; overflow: hidden; }
    .nav-inner { max-width: 1500px; width: 100%; margin: auto; padding: 0 14px; display: flex; gap: 20px; white-space: nowrap; font-weight: 700; font-size: 12px; }
    .content { max-width: 1500px; margin: 14px auto; padding: 0 14px; }
    .hero { height: 230px; border-radius: 4px; background: linear-gradient(90deg,#dceafa,#fff,#ffe8b8); display: flex; align-items: center; justify-content: center; }
    .hero h1 { margin: 0; font-size: 30px; }
    .hero p { color: #37475a; }
    .loader { width: 44px; height: 44px; margin: 20px auto 0; border: 4px solid #d8dce1; border-top-color: #ff9900; border-radius: 50%; animation: spin .75s linear infinite; }
    .loading-card { text-align: center; padding: 30px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="top">
      <div class="top-inner">
        <div class="brand">بازارک<small>خرید و فروش در افغانستان</small></div>
        <div class="search"><span>در بین هزاران آگهی جستجو کنید...</span><b>⌕</b></div>
      </div>
    </div>
    <div class="nav"><div class="nav-inner"><span>☰ همه دسته‌بندی‌ها</span><span>املاک و خانه</span><span>وسایط نقلیه</span><span>لوازم الکترونیکی</span><span>لوازم خانه</span></div></div>
    <div class="content">
      <div class="hero">
        <div class="loading-card">
          <h1>خرید و فروش در افغانستان</h1>
          <p>بازارک در حال آماده‌سازی فروشگاه شماست...</p>
          <div class="loader"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
