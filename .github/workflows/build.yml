name: Build Bazarek APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # The repository contains a few accidentally uploaded resource files
      # with invalid Android resource names. Keep the real app resources only.
      - name: Clean invalid Android resources
        shell: bash
        run: |
          set -euo pipefail
          RES="android_shell/app/src/main/res"
          rm -f "$RES/drawable/1"
          rm -f "$RES/mipmap-hdpi/1"
          rm -f "$RES/mipmap-mdpi/1"
          rm -f "$RES/mipmap-xhdpi/1"
          rm -f "$RES/mipmap-xxhdpi/1"
          rm -f "$RES/mipmap-xxxhdpi/1"
          rm -f "$RES/xml/file_paths.xm"
          rm -f "$RES/drawable-nodpi/Icon-192.png"
          rm -f "$RES/drawable-nodpi/Icon-192 (1).png"
          rm -f "$RES/drawable-nodpi/Icon-maskable-192.png"
          rm -f "$RES/drawable-nodpi/Icon-maskable-512.png"
          rm -f "$RES/drawable-nodpi/Icon-maskable-512 (1).png"
          test -f "$RES/drawable-nodpi/bazarek_icon.png"
          test -f "$RES/xml/file_paths.xml"
          test -f "$RES/xml/network_security_config.xml"

      - name: Build Android WebView shell
        working-directory: android_shell
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK for direct installation
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="android_shell/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android_shell/app/build/outputs/apk/release/bazarek-release-aligned.apk"
          SIGNED="android_shell/app/build/outputs/apk/release/bazarek-release-signed.apk"

          keytool -genkeypair -v \
            -keystore /tmp/bazarek-release.jks \
            -storepass bazarek-temp \
            -keypass bazarek-temp \
            -alias bazarek \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bazarek, OU=Bazarek, O=Bazarek, L=Kabul, ST=Kabul, C=AF"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/bazarek-release.jks \
            --ks-pass pass:bazarek-temp \
            --key-pass pass:bazarek-temp \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: bazarek-release-signed-apk
          path: android_shell/app/build/outputs/apk/release/bazarek-release-signed.apk
          if-no-files-found: error
