name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      # The repository does not commit generated Android platform files.
      # Generate them BEFORE pub get so plugin registration is clean.
      - name: Generate Flutter platform files
        run: flutter create . --platforms=android,web

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android WebView permission
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission)
              p.write_text(s)
          PY2

      - name: Verify Android Manifest
        run: test -f android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release --base-href /

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bazarek-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
