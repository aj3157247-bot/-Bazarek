name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Generate Flutter platform files
        run: flutter create . --platforms=android,web

      # flutter create regenerates web/index.html and the web manifest.
      # Restore the Bazarek PWA files committed in this repository.
      - name: Restore Bazarek Web/PWA branding
        run: |
          git checkout -- web/index.html web/manifest.json web/icons/
          test -f web/index.html
          test -f web/manifest.json
          test -f web/icons/bazarek-pwa-192.png
          test -f web/icons/bazarek-pwa-512.png
          grep -F '<base href="$FLUTTER_BASE_HREF">' web/index.html

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/bazarek-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bazarek-release.jks
          EOF
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          if 'keystorePropertiesFile' not in text:
              prefix = """def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

"""
              signing = """    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

"""
              text = prefix + text.replace('android {
', 'android {
' + signing, 1)
          text = text.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          text = text.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          p.write_text(text, encoding='utf-8')
          PY2

      - name: Configure Android WebView shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
          ]
          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}"/>\n'
              if permission not in text:
                  text = text.replace('<application', line + '    <application', 1)
          text = text.replace('android:label="${applicationName}"', 'android:label="بازارک"')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Verify Android Manifest
        run: test -f android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release --base-href /

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bazarek-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
