name: Build Bazarek APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean invalid Android resources
        shell: bash
        run: |
          set -euo pipefail
          # The WebView shell uses bazarek_icon.png as its actual launcher icon.
          # Remove old copied PWA/icon assets whose names are illegal Android resources
          # (uppercase letters, spaces, or other invalid resource-name characters).
          find android_shell/app/src/main/res -type f \
            \( -name 'Icon-*.png' -o -name 'Icon-*' -o -name '* *' -o -name '*.xm' \
               -o -name '1' -o -name '2' -o -name '3' -o -name '4' -o -name '5' \
               -o -name '6' -o -name '7' -o -name '8' -o -name '9' \
            \) -delete || true

      - name: Build Android WebView shell
        working-directory: android_shell
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK for direct installation
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="android_shell/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android_shell/app/build/outputs/apk/release/bazarek-release-aligned.apk"
          SIGNED="android_shell/app/build/outputs/apk/release/bazarek-release-signed.apk"

          keytool -genkeypair -v \
            -keystore /tmp/bazarek-release.jks \
            -storepass bazarek-temp \
            -keypass bazarek-temp \
            -alias bazarek \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bazarek, OU=Bazarek, O=Bazarek, L=Kabul, ST=Kabul, C=AF"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/bazarek-release.jks \
            --ks-pass pass:bazarek-temp \
            --key-pass pass:bazarek-temp \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

          # This exact filename is used by the website's download button.
          cp "$SIGNED" bazarek.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazarek-release-signed-apk
          path: bazarek.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: بازارک v1.4.${{ github.run_number }}
          body: نسخه قابل نصب مستقیم بازارک
          files: bazarek.apk
          fail_on_unmatched_files: true
