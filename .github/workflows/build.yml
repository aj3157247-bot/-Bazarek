name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      # The repository does not commit generated Android platform files.
      # Generate them BEFORE pub get so plugin registration is clean.
      - name: Generate Flutter platform files
        run: flutter create . --platforms=android,web

      - name: Configure Android WebView shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
          ]
          for permission in permissions:
              line = f'    <uses-permission android:name=\"{permission}\"/>\n'
              if permission not in text:
                  text = text.replace('<application', line + '    <application', 1)
          text = text.replace('android:label=\"${applicationName}\"', 'android:label=\"بازارک\"')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Verify Android Manifest
        run: test -f android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release --base-href /

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bazarek-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
