plugins { id 'com.android.application' }

android {
    namespace 'com.bazarek.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bazarek.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
