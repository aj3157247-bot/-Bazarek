name: bazarek
description: "دستیار فروش هوشمند بازارک - Smart Sales Assistant"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.2.0
  http_parser: ^4.1.2
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  file_picker: ^12.2.0
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/bazarek_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/bazarek_icon.png
  min_sdk_android: 21
